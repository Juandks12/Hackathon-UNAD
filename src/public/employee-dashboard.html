<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empleado - Control de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success shadow">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Panel Empleado</span>
      <button class="btn btn-outline-light">Cerrar Sesión</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="text-center mb-4">
      <h2>Bienvenido, Juan</h2>
      <p class="text-muted">Hora actual: <span id="hora"></span></p>
      <button class="btn btn-primary me-2"><i class="bi bi-box-arrow-in-right"></i> Check-In</button>
      <button class="btn btn-danger"><i class="bi bi-box-arrow-left"></i> Check-Out</button>
    </div>

    <h4>Historial</h4>
    <table class="table table-bordered table-striped">
      <thead class="table-success">
        <tr>
          <th>Fecha</th>
          <th>Entrada</th>
          <th>Salida</th>
          <th>Horas trabajadas</th>
          <th>Tardanza</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>29/09/2025</td>
          <td>08:05</td>
          <td>17:00</td>
          <td>8h 55m</td>
          <td class="text-danger">Sí</td>
        </tr>
        <tr>
          <td>30/09/2025</td>
          <td>07:55</td>
          <td>17:00</td>
          <td>9h 05m</td>
          <td class="text-success">No</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    setInterval(() => {
      document.getElementById("hora").innerText = new Date().toLocaleTimeString();
    }, 1000);
  </script>
</body>
</html>
