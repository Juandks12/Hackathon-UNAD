<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Control de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Panel Admin</a>
      <div class="d-flex">
        <button class="btn btn-outline-light">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 bg-light vh-100 p-3 shadow-sm">
        <h5 class="fw-bold">Menú</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-people"></i> Usuarios</a></li>
          <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-clock-history"></i> Fichajes</a></li>
          <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-graph-up"></i> Reportes</a></li>
        </ul>
      </div>

      <!-- Main content -->
      <div class="col-md-10 p-4">
        <h2 class="mb-4">Dashboard</h2>

        <!-- KPIs -->
        <div class="row mb-4">
          <div class="col-md-3">
            <div class="card shadow-sm text-center">
              <div class="card-body">
                <h5 class="card-title">Usuarios</h5>
                <p class="fs-3 fw-bold text-primary">35</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm text-center">
              <div class="card-body">
                <h5 class="card-title">Horas trabajadas</h5>
                <p class="fs-3 fw-bold text-success">280</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm text-center">
              <div class="card-body">
                <h5 class="card-title">Tardanzas</h5>
                <p class="fs-3 fw-bold text-danger">12</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabla usuarios -->
        <h4 class="mb-3">Gestión de Usuarios</h4>
        <button class="btn btn-primary mb-3"><i class="bi bi-plus-circle"></i> Nuevo Usuario</button>
        <table class="table table-striped table-hover shadow-sm">
          <thead class="table-primary">
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>juanperez</td>
              <td>Empleado</td>
              <td>
                <button class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td>2</td>
              <td>admin</td>
              <td>Admin</td>
              <td>
                <button class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
  </div>
</body>
</html>
